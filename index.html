const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tabs(){$('#tabs').innerHTML=Object.keys(DAYS).map(d=>`<button class="${+d===day?'active':''}" onclick="setDay(${d})">${d}일차 (${DAYS[d].length})</button>`).join('')}
function setDay(d){day=d;$('#search').value='';$('#quiz').style.display='none';$('#study').style.display='block';tabs();render();scrollTo(0,0)}
function render(){let q=$('#search').value.trim().toLowerCase(),arr=DAYS[day],shown=0,done=0;let h='';arr.forEach(x=>{let k=day+'-'+x.n,ck=!!saved[k];if(ck)done++;let txt=(x.w+x.r+x.m+x.ctx+x.tr).toLowerCase();if((q&&!txt.includes(q))||(todo&&ck))return;shown++;h+=`<article class="card"><div class="num">${day}일차 · ${x.n}번</div><div class="word">${esc(x.w)}</div><div class="pron">[${esc(x.r)}]</div><div class="meaning">${esc(x.m)}</div><div class="ctx"><b>문장/표현</b> · ${esc(x.ctx)}<div class="tr"><b>해석</b> · ${esc(x.tr)}</div></div><label class="done"><input type="checkbox" ${ck?'checked':''} onchange="mark('${k}',this.checked)"> 암기 완료</label></article>`});$('#study').classList.toggle('hideMeaning',hide);$('#study').innerHTML=h;$('#stats').textContent=`${day}일차 · 총 ${arr.length}개 · 암기완료 ${done} · 현재표시 ${shown}`}
function mark(k,v){saved[k]=v;localStorage.setItem(LS,JSON.stringify(saved));render()}
$('#search').oninput=render;$('#hideBtn').onclick=()=>{hide=!hide;$('#hideBtn').textContent=hide?'뜻 보이기':'뜻 가리기';render()};$('#todoBtn').onclick=()=>{todo=!todo;$('#todoBtn').textContent=todo?'전체 보기':'미암기만';render()};
$('#testBtn').onclick=setup;$('#writeTestBtn').onclick=setupWrite;
function setup(){$('#study').style.display='none';$('#quiz').style.display='block';let max=DAYS[day].length;$('#quiz').innerHTML=`<div class="quizbox"><h2>${day}일차 테스트</h2><div class="range">번호 범위 <input id="rs" type="number" min="1" max="${max}" value="1"> ~ <input id="re" type="number" min="1" max="${max}" value="${max}"></div><div class="sizes">${[10,20,30,40,50,60].map(n=>`<button onclick="startQuiz(${n})">${n}개</button>`).join('')}<button onclick="startQuiz(9999)">범위 전체</button></div><p class="sub">원단어뿐 아니라 사진의 본문·선택지·숙어까지 각각 독립 단어로 들어 있어 모두 출제됩니다. 채점은 마지막에 한꺼번에 합니다.</p></div>`}
let qs=[],answers={},qi=0;
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function startQuiz(cnt){let s=Math.max(1,+$('#rs').value||1),e=Math.min(DAYS[day].length,+$('#re').value||DAYS[day].length);let pool=DAYS[day].filter(x=>x.n>=s&&x.n<=e);qs=shuffle(pool).slice(0,Math.min(cnt,pool.length));answers={};qi=0;showQ()}
function showQ(){if(qi>=qs.length)return finish();let x=qs[qi],wrong=shuffle(DAYS[day].filter(y=>y.w!==x.w)).slice(0,3),opts=shuffle([x,...wrong]);$('#quiz').innerHTML=`<div class="quizbox"><div class="sub">${qi+1} / ${qs.length}</div><div class="quizword">${esc(x.w)}</div><div class="pron">[${esc(x.r)}]</div><div class="choices">${opts.map(o=>`<button onclick="pick(${x.n},${o.n},this)">${esc(o.m)}</button>`).join('')}</div><div style="margin-top:12px"><button class="primary" onclick="nextQ()">다음</button></div></div>`}
function pick(q,a,b){answers[q]=a;document.querySelectorAll('.choices button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
function nextQ(){qi++;showQ()}
function finish(){let correct=0;let h='';qs.forEach(x=>{let a=answers[x.n],ok=a===x.n;if(ok)correct++;let ua=DAYS[day].find(y=>y.n===a);h+=`<div class="result ${ok?'ok':'bad'}"><b>${ok?'⭕':'❌'} ${esc(x.w)}</b> [${esc(x.r)}]<br>내 답: ${ua?esc(ua.m):'미응답'}<br><b>정답: ${esc(x.m)}</b><br><span class="sub">${esc(x.ctx)} → ${esc(x.tr)}</span></div>`});$('#quiz').innerHTML=`<div class="quizbox"><h2>결과 ${correct} / ${qs.length}</h2>${h}<div style="margin-top:14px"><button onclick="setup()">다시 테스트</button> <button class="primary" onclick="setDay(day)">단어장으로</button></div></div>`}

function setupWrite(){
  $('#study').style.display='none';$('#quiz').style.display='block';
  let max=DAYS[day].length;
  $('#quiz').innerHTML=`<div class="quizbox"><h2>${day}일차 직접쓰기 테스트</h2>
  <div class="range">번호 범위 <input id="wrs" type="number" min="1" max="${max}" value="1"> ~ <input id="wre" type="number" min="1" max="${max}" value="${max}"></div>
  <div class="sizes">${[10,20,30,40,50,60].map(n=>`<button onclick="startWrite(${n})">${n}개</button>`).join('')}<button onclick="startWrite(9999)">범위 전체</button></div>
  <p class="sub">뜻을 보고 영어 단어·숙어를 직접 입력하세요. 대소문자는 구분하지 않습니다. 마지막에 한꺼번에 채점합니다.</p></div>`;
}
let wqs=[],wanswers={},wqi=0;
function startWrite(cnt){
  let s=Math.max(1,+$('#wrs').value||1),e=Math.min(DAYS[day].length,+$('#wre').value||DAYS[day].length);
  let pool=DAYS[day].filter(x=>x.n>=s&&x.n<=e);
  wqs=shuffle(pool).slice(0,Math.min(cnt,pool.length));wanswers={};wqi=0;showWQ();
}
function showWQ(){
  if(wqi>=wqs.length)return finishWrite();
  let x=wqs[wqi];
  $('#quiz').innerHTML=`<div class="quizbox"><div class="sub">${wqi+1} / ${wqs.length}</div>
  <div class="quizword">${esc(x.m)}</div>
  <div style="margin:14px 0"><input id="writeAnswer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="영어 단어·숙어를 직접 입력" style="width:100%;box-sizing:border-box;padding:13px;font-size:18px;border:1px solid var(--line);border-radius:10px"></div>
  <div><button class="primary" onclick="nextWQ()">다음</button></div></div>`;
  setTimeout(()=>{let a=$('#writeAnswer');if(a){a.focus();a.onkeydown=e=>{if(e.key==='Enter')nextWQ()}}},0);
}
function nextWQ(){
  let x=wqs[wqi],a=$('#writeAnswer');wanswers[x.n]=a?a.value.trim():'';
  wqi++;showWQ();
}
function norm(s){return String(s||'').trim().toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ')}
function finishWrite(){
  let correct=0,h='';
  wqs.forEach(x=>{
    let a=wanswers[x.n]||'',ok=norm(a)===norm(x.w);if(ok)correct++;
    h+=`<div class="result ${ok?'ok':'bad'}"><b>${ok?'⭕':'❌'} ${esc(x.m)}</b><br>내 답: ${a?esc(a):'미응답'}<br><b>정답: ${esc(x.w)}</b> [${esc(x.r)}]<br><span class="sub">${esc(x.ctx)} → ${esc(x.tr)}</span></div>`;
  });
  $('#quiz').innerHTML=`<div class="quizbox"><h2>직접쓰기 결과 ${correct} / ${wqs.length}</h2>${h}<div style="margin-top:14px"><button onclick="setupWrite()">다시 직접쓰기</button> <button onclick="setup()">선택형 테스트</button> <button class="primary" onclick="setDay(day)">단어장으로</button></div></div>`;
}
tabs();render();</script></body></html>
